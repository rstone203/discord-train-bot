[project]
name = "discord-bot-server"
version = "0.1.0"
description = "Advanced Discord bot hosting solution with robust server management capabilities"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.4",
    "alembic>=1.16.4",
    "discord-py>=2.5.2",
    "flask>=3.1.3",
    "mako>=1.3.12",
    "openai>=2.44.0",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "pytz>=2025.2",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.42",
    "stripe>=12.4.0",
    "urllib3>=2.6.3",
    "websockets>=15.0.1",
    "werkzeug>=3.1.8",
]

[project.scripts]
discord-bot = "main:main"
bot-server = "main:main"
start-bot = "main:main"
deploy-bot = "main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main", 
    "app", 
    "bot", 
    "config", 
    "dashboard", 
    "database", 
    "deploy", 
    "deployment", 
    "keep_alive", 
    "models", 
    "run", 
    "simple_dashboard", 
    "start", 
    "start_deployment", 
    "start_server"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cogs*", "utils*"]
exclude = ["static*", "templates*", "attached_assets*", "tests*"]

[tool.setuptools.package-data]
"*" = ["static/*", "templates/*"]

[tool.deployment]
entry-points = ["main.py"]
health-check-endpoint = "/"
port = 5000
explicit-run-command = "python main.py"
run = "python main.py"

[tool.replit]
run = "python main.py"
deploymentTarget = "cloudrun"

[tool.replit.deployment]
run = ["python", "main.py"]
deploymentTarget = "cloudrun"

[dependency-groups]
dev = [
    "discord-py>=2.5.2",
    "pytest>=9.1.1",
]
