name: Discord Bot Server Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Deployment configuration
  RUN_COMMAND: "python main.py"
  HEALTH_CHECK_PATH: "/"
  PORT: 5000
  ENTRY_POINT: "main.py"

jobs:
  deploy:
    name: Deploy Discord Bot Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Validate Deployment Configuration
        run: |
          echo "🔍 Validating deployment configuration..."
          echo "Entry Point: $ENTRY_POINT"
          echo "Run Command: $RUN_COMMAND"
          echo "Health Check: $HEALTH_CHECK_PATH"
          echo "Port: $PORT"
          
          # Verify main.py exists
          if [ ! -f "main.py" ]; then
            echo "❌ main.py not found!"
            exit 1
          fi
          echo "✅ main.py found"
          
          # Verify no $file variable usage
          if grep -r '\$file' . --exclude-dir=.git; then
            echo "❌ Found \$file variable usage - deployment will fail"
            exit 1
          fi
          echo "✅ No \$file variable dependencies found"
          
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Health Check Test
        run: |
          echo "🔍 Testing health endpoints..."
          # Start server in background
          python main.py &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Test health endpoints
          curl -f http://localhost:5000/ || exit 1
          curl -f http://localhost:5000/health || exit 1
          curl -f http://localhost:5000/healthz || exit 1
          
          # Cleanup
          kill $SERVER_PID
          
          echo "✅ All health checks passed"
          
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying Discord Bot Server..."
          echo "Using explicit run command: $RUN_COMMAND"
          echo "Health check endpoint: $HEALTH_CHECK_PATH"
          echo "Deployment ready ✅"